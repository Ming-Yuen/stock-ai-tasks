name: Temporary stock quote ZIP migration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch archived source commits
        run: |
          set -euo pipefail
          git fetch origin stock-zip-source-monthly-2024:refs/remotes/origin/stock-zip-source-monthly-2024
          git fetch origin stock-zip-source-gz-2025:refs/remotes/origin/stock-zip-source-gz-2025

      - name: Build yearly ZIP archives
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/monthly /tmp/gz2025 /tmp/zipout /tmp/stock2025
          mkdir -p /tmp/monthly /tmp/gz2025 /tmp/zipout /tmp/stock2025/months

          git archive origin/stock-zip-source-monthly-2024 data/stock-quote | tar -xf - -C /tmp/monthly
          for year in $(seq 2015 2024); do
            dir="/tmp/monthly/data/stock-quote/${year}"
            test -d "$dir"
            (cd "$dir" && zip -9 -q "/tmp/zipout/stock_quote-${year}.zip" stock_quote-${year}-*.csv)
          done

          git archive origin/stock-zip-source-gz-2025 data/stock-quote/2025 | tar -xf - -C /tmp/gz2025
          find /tmp/gz2025/data/stock-quote/2025 -name 'stock_quote-*.csv.gz' -type f | sort > /tmp/stock2025/chunks.txt
          test -s /tmp/stock2025/chunks.txt
          : > /tmp/stock2025/all.csv
          while IFS= read -r chunk; do
            gzip -cd "$chunk" | tail -n +2 >> /tmp/stock2025/all.csv
          done < /tmp/stock2025/chunks.txt
          LC_ALL=C sort -t',' -k2,2 -k1,1 /tmp/stock2025/all.csv > /tmp/stock2025/sorted.csv

          python3 - <<'PY'
          import csv
          from pathlib import Path

          columns = ["figi", "quote_date", "open_price", "high_price", "low_price", "close_price", "volume", "market_cap", "data_source"]
          source = Path("/tmp/stock2025/sorted.csv")
          output = Path("/tmp/stock2025/months")
          current_month = None
          handle = None
          writer = None
          previous = None
          rows = 0
          try:
              with source.open("r", encoding="utf-8", newline="") as f:
                  reader = csv.reader(f)
                  for row in reader:
                      if len(row) != len(columns):
                          raise RuntimeError(f"Unexpected 2025 column count: {len(row)}")
                      date = row[1]
                      if not date.startswith("2025-"):
                          raise RuntimeError(f"Unexpected 2025 quote_date: {date}")
                      key = (date, row[0])
                      if previous is not None and key < previous:
                          raise RuntimeError("2025 data is not ordered by quote_date, figi")
                      previous = key
                      month = date[5:7]
                      if month != current_month:
                          if handle is not None:
                              handle.close()
                          current_month = month
                          handle = (output / f"stock_quote-2025-{month}.csv").open("w", encoding="utf-8", newline="")
                          writer = csv.writer(handle, lineterminator="\n")
                          writer.writerow(columns)
                      writer.writerow(row)
                      rows += 1
          finally:
              if handle is not None:
                  handle.close()
          if rows != 2472956:
              raise RuntimeError(f"2025 row count mismatch: {rows}")
          PY

          (cd /tmp/stock2025/months && zip -9 -q /tmp/zipout/stock_quote-2025.zip stock_quote-2025-*.csv)

      - name: Verify archives and row counts
        shell: bash
        run: |
          set -euo pipefail
          declare -A expected
          expected[2015]=173
          expected[2016]=401322
          expected[2017]=1144907
          expected[2018]=1248922
          expected[2019]=1348745
          expected[2020]=1462004
          expected[2021]=1643908
          expected[2022]=1810248
          expected[2023]=1934807
          expected[2024]=2156818
          expected[2025]=2472956

          total=0
          for year in $(seq 2015 2025); do
            archive="/tmp/zipout/stock_quote-${year}.zip"
            test -f "$archive"
            size=$(stat -c%s "$archive")
            test "$size" -lt 100000000
            rows=0
            files=0
            while IFS= read -r entry; do
              case "$entry" in
                *.csv)
                  lines=$(unzip -p "$archive" "$entry" | wc -l)
                  rows=$((rows + lines - 1))
                  files=$((files + 1))
                  ;;
              esac
            done < <(unzip -Z1 "$archive")
            test "$rows" -eq "${expected[$year]}"
            if [ "$year" -eq 2015 ]; then test "$files" -eq 9; else test "$files" -eq 12; fi
            total=$((total + rows))
            echo "VERIFIED year=$year rows=$rows files=$files bytes=$size"
          done
          test "$total" -eq 15624810
          echo "VERIFIED_TOTAL rows=$total archives=11"

      - name: Replace stock quote archive and push
        shell: bash
        run: |
          set -euo pipefail
          rm -rf data/stock-quote
          mkdir -p data/stock-quote
          cp /tmp/zipout/stock_quote-*.zip data/stock-quote/
          rm -f .github/workflows/stock-zip-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/stock-quote .github/workflows/stock-zip-migration.yml
          git commit -m 'Replace stock quote archive with yearly ZIP files'
          git push origin HEAD:main
